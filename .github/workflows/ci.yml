name: .NET CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/web-api]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore HelloDevOps.slnx

      - name: Build
        run: dotnet build HelloDevOps.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test HelloDevOps.slnx --configuration Release --no-build

      - name: Build Docker image
        run: docker build --tag hello-devops:ci .

  publish-image:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/web-api'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/madhan0190/devops-project-1:${{ github.sha }}
            ghcr.io/madhan0190/devops-project-1:feature-web-api-latest
