name: .NET CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore HelloDevOps.slnx

      - name: Build
        run: dotnet build HelloDevOps.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test HelloDevOps.slnx --configuration Release --no-build